server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the exact nginx version.
    server_tokens off;

    # Storybook emits content-hashed bundles; index.html must stay uncached so a
    # redeploy is picked up immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
