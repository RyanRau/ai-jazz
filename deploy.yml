# deploy.yml — The control plane for deployments
# Set enabled: true to deploy an app, false to take it offline.
# Validate changes with: python3 infra/validate_deploy.py

domain: ryanzrau.dev
registry: ghcr.io/ryanrau/mono
letsencrypt_email: me@ryanzrau.dev

# Subdomains owned by apps deployed from *other* repos onto the same droplet
# (see "External App Deployments" in CLAUDE.md). Listed here so validation
# rejects a monorepo app that would collide with one.
reserved_subdomains:
  - drinkz

# Internal services: pulled images on the shared docker network, never routed
# by Traefik and never exposed to the internet. Apps reach them by service name.
# (None currently — PocketBase uses embedded SQLite. Add e.g. redis here later.)
# services:
#   redis:
#     image: redis:7-alpine
#     enabled: true

apps:
  # Shared backend: PocketBase (auth + collections + admin UI + custom hook
  # routes). Data persists in the pb_data volume.
  pocketbase:
    subdomain: "api"
    enabled: true
    port: 8080
    # AES key for chat.pb.js's encryption-at-rest of chat message content —
    # see infra/README.md's "Runtime secrets" for how this reaches
    # /opt/apps/.env. Without it, chat.pb.js falls back to a hardcoded
    # dev-only key, which is fine locally but not in production.
    environment:
      CHAT_ENCRYPTION_KEY: "${CHAT_ENCRYPTION_KEY}"
    volumes:
      - pb_data:/pb/pb_data
    # Optional: enables hub's "invite user" feature to actually email the
    # activation link instead of falling back to a copy/paste link. Unset
    # in /opt/apps/.env until real SMTP creds exist -- see
    # apps/pocketbase/README.md.
    environment:
      SMTP_HOST: "${SMTP_HOST}"
      SMTP_PORT: "${SMTP_PORT}"
      SMTP_USERNAME: "${SMTP_USERNAME}"
      SMTP_PASSWORD: "${SMTP_PASSWORD}"
      SMTP_SENDER_ADDRESS: "${SMTP_SENDER_ADDRESS}"
      SMTP_SENDER_NAME: "${SMTP_SENDER_NAME}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    # Tighter than the default: this is the auth endpoint and the admin UI.
    rate_limit:
      average: 30
      burst: 15
  ryanzrau:
    subdomain: ""
    enabled: true
    port: 80
  bluestar:
    subdomain: "ui"
    enabled: true
    port: 80
    path: "packages/bluestar"
  hub:
    subdomain: "hub"
    enabled: true
    port: 80
  stash:
    subdomain: "stash"
    enabled: true
    port: 80
  tony:
    subdomain: "tony"
    enabled: true
    port: 80
