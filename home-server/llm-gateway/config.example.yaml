# Copy to config.yaml. Keep config.yaml out of git — it holds the PocketBase
# service-account password.

server:
  host: "0.0.0.0" # needs to be reachable on the LAN, not just localhost
  port: 8000
  max_parallel_requests: 3
  model_idle_timeout_seconds: 900 # 0 disables auto-unload
  request_timeout_seconds: 300

# API keys and usage are managed in PocketBase (mono's shared backend), not
# here -- see home-server/llm-gateway/README.md#auth. This is plain outbound
# HTTPS to a normal public endpoint; it doesn't need the WireGuard tunnel.
auth:
  pocketbase_url: "https://api.ryanzrau.dev"
  service_email: "llm-gateway@service.internal" # create in the PocketBase admin UI, is_service: true
  service_password: "REPLACE-ME"
  key_refresh_seconds: 60 # how often to re-pull the active-key list
  usage_flush_seconds: 20 # how often to push buffered usage rows
  session_cache_seconds: 60 # how long a resolved PocketBase session token stays cached

llama_server:
  binary: "/opt/homebrew/bin/llama-server" # `which llama-server`
  host: "127.0.0.1"
  port: 8100
  startup_timeout_seconds: 180

# Optional. When set, Chat (/v1/chat/send) offers the model a `web_search`
# tool backed by a local SearXNG instance -- see README.md#web-search. Omit
# this whole section to leave Chat exactly as it is today.
# web_search:
#   searxng_url: "http://127.0.0.1:8080"

# Optional. When enabled, Chat (/v1/chat/send) also offers the model a
# `fetch_url` tool that retrieves a specific link and converts its main
# content to markdown -- see README.md#link-reading. Independent of
# web_search above (no SearXNG needed). Omit or leave disabled to leave
# Chat exactly as it is today.
# url_fetch:
#   enabled: true

# Optional. When enabled, Chat also offers the model a `write_file` tool
# that creates a small plain-text file (md/txt/py/html/csv) handed back to
# the user as a download -- see README.md#file-reading-and-writing. Reading
# an attached pdf/csv/txt/md document the user uploads is unrelated to this
# flag and always available -- that's the user's own action, not a tool the
# model chooses to invoke.
# file_tools:
#   enabled: true

# `description`/`best_for` are optional, freeform, and purely informational
# -- surfaced by GET /v1/models for a model picker UI, never read by the
# gateway itself. `context_size` and `size_bytes` don't need declaring here:
# GET /v1/models derives them from `args.ctx-size` and the model file on
# disk respectively.
models:
  - name: "qwen3.5-2b"
    aliases: ["2b"]
    model_path: "~/server/llm/models/qwen3.5-2b/Qwen3.5-2B-Q4_K_M.gguf"
    mmproj_path: "~/server/llm/models/qwen3.5-2b/mmproj-BF16.gguf"
    vision: true
    description: "Smallest model, fastest responses."
    best_for: "Quick questions, low-latency chat"
    args:
      ctx-size: 32768
      n-gpu-layers: 99
      jinja: true
      no-webui: true
      reasoning-budget: 1024

  - name: "qwen3.5-4b"
    aliases: ["4b"]
    model_path: "~/server/llm/models/qwen3.5-4b/Qwen3.5-4B-Q4_K_M.gguf"
    mmproj_path: "~/server/llm/models/qwen3.5-4b/mmproj-BF16.gguf"
    vision: true
    description: "Mid-sized general-purpose model, a step up in quality from the 2B."
    best_for: "General chat, everyday questions"
    args:
      ctx-size: 32768
      n-gpu-layers: 99
      jinja: true
      no-webui: true
      reasoning-budget: 1024

  - name: "qwen3.5-9b"
    aliases: ["9b", "default"]
    model_path: "~/server/llm/models/qwen3.5-9b/Qwen3.5-9B-Q4_K_M.gguf"
    mmproj_path: "~/server/llm/models/qwen3.5-9b/mmproj-BF16.gguf"
    vision: true
    description: "Largest general-purpose model, the gateway's default."
    best_for: "Higher-quality chat, harder reasoning"
    args:
      ctx-size: 16384
      n-gpu-layers: 99
      jinja: true
      no-webui: true
      reasoning-budget: 1024

  - name: "qwen2.5-coder-7b"
    aliases: ["coder"]
    model_path: "~/server/llm/models/qwen2.5-coder-7b/qwen2.5-coder-7b-instruct-q4_k_m.gguf"
    vision: false
    description: "Code-specialized model, no vision support."
    best_for: "Writing and reviewing code"
    args:
      ctx-size: 24576
      n-gpu-layers: 99
      jinja: true
      no-webui: true
      reasoning-budget: 1024

  - name: "phi-4-14b"
    aliases: ["phi4"]
    model_path: "~/server/llm/models/phi-4-14b/phi-4-Q4_K_M.gguf"
    vision: false
    description: "Largest model, no vision support, smallest context window."
    best_for: "Complex reasoning where context length isn't the constraint"
    args:
      ctx-size: 8192
      n-gpu-layers: 99
      jinja: true
      no-webui: true
      reasoning-budget: 1024
