# Copy to config.yaml. Keep config.yaml out of git — it holds the PocketBase
# service-account password.

server:
  host: "0.0.0.0" # needs to be reachable on the LAN, not just localhost
  port: 8000
  max_parallel_requests: 3
  model_idle_timeout_seconds: 900 # 0 disables auto-unload
  request_timeout_seconds: 300

# API keys and usage are managed in PocketBase (mono's shared backend), not
# here -- see home-server/llm-gateway/README.md#auth. This is plain outbound
# HTTPS to a normal public endpoint; it doesn't need the WireGuard tunnel.
auth:
  pocketbase_url: "https://api.ryanzrau.dev"
  service_email: "llm-gateway@service.internal" # create in the PocketBase admin UI, is_service: true
  service_password: "REPLACE-ME"
  key_refresh_seconds: 60 # how often to re-pull the active-key list
  usage_flush_seconds: 20 # how often to push buffered usage rows
  session_cache_seconds: 60 # how long a resolved PocketBase session token stays cached

llama_server:
  binary: "/opt/homebrew/bin/llama-server" # `which llama-server`
  host: "127.0.0.1"
  port: 8100
  startup_timeout_seconds: 180

# Optional. When set, Chat (/v1/chat/send) offers the model a `web_search`
# tool backed by a local SearXNG instance -- see README.md#web-search. Omit
# this whole section to leave Chat exactly as it is today.
# web_search:
#   searxng_url: "http://127.0.0.1:8080"

models:
  - name: "qwen3.5-2b"
    aliases: ["2b"]
    model_path: "~/server/llm/models/qwen3.5-2b/Qwen3.5-2B-Q4_K_M.gguf"
    mmproj_path: "~/server/llm/models/qwen3.5-2b/mmproj-BF16.gguf"
    vision: true
    # Freeform markdown shown in Tony's model info modal -- pros/cons,
    # tradeoffs, whatever's useful to know before picking this one. Optional;
    # omit for no info button on this model.
    notes: |
      Smallest, fastest model on this box -- good for quick/simple tasks
      where latency matters more than depth. Struggles with anything
      requiring multi-step reasoning.
    args:
      ctx-size: 32768
      n-gpu-layers: 99
      jinja: true
      no-webui: true
      reasoning-budget: 1024

  - name: "qwen3.5-4b"
    aliases: ["4b"]
    model_path: "~/server/llm/models/qwen3.5-4b/Qwen3.5-4B-Q4_K_M.gguf"
    mmproj_path: "~/server/llm/models/qwen3.5-4b/mmproj-BF16.gguf"
    vision: true
    notes: |
      A step up from the 2B in reasoning quality, still fast. Reasonable
      default for everyday chat.
    args:
      ctx-size: 32768
      n-gpu-layers: 99
      jinja: true
      no-webui: true
      reasoning-budget: 1024

  - name: "qwen3.5-9b"
    aliases: ["9b", "default"]
    model_path: "~/server/llm/models/qwen3.5-9b/Qwen3.5-9B-Q4_K_M.gguf"
    mmproj_path: "~/server/llm/models/qwen3.5-9b/mmproj-BF16.gguf"
    vision: true
    notes: |
      The general-purpose default -- best balance of quality and speed on
      this hardware for most chat and vision tasks.
    args:
      ctx-size: 16384
      n-gpu-layers: 99
      jinja: true
      no-webui: true
      reasoning-budget: 1024

  - name: "qwen2.5-coder-7b"
    aliases: ["coder"]
    model_path: "~/server/llm/models/qwen2.5-coder-7b/qwen2.5-coder-7b-instruct-q4_k_m.gguf"
    vision: false
    notes: |
      Tuned for code -- reach for this over the general-purpose models for
      anything code-generation or code-review shaped. No vision support.
    args:
      ctx-size: 24576
      n-gpu-layers: 99
      jinja: true
      no-webui: true
      reasoning-budget: 1024

  - name: "phi-4-14b"
    aliases: ["phi4"]
    model_path: "~/server/llm/models/phi-4-14b/phi-4-Q4_K_M.gguf"
    vision: false
    notes: |
      Largest model on this box -- strongest reasoning, slowest and most
      memory-hungry. Worth the wait for genuinely hard problems, overkill
      for quick questions.
    args:
      ctx-size: 8192
      n-gpu-layers: 99
      jinja: true
      no-webui: true
      reasoning-budget: 1024
