name: Build Devcontainer Image

# Publishes the standalone workstation image from .devcontainer/Dockerfile —
# dev tooling, not a deployed app, so it isn't in deploy.yml or the main
# Build and Deploy workflow. `docker run` this directly; see
# infra/devbox/README.md for the commands.
on:
  push:
    branches: [main]
    paths: [".devcontainer/**"]
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/${{ github.repository }}/devcontainer

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .devcontainer
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
