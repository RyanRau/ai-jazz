name: PR Validation

on:
  pull_request:

# Superseded runs on the same PR are pointless — cancel them when you push again.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the app selection can diff against the PR base.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Config first — a broken deploy.yml fails the whole deploy, so catch it
      # before spending CI minutes on Docker builds.
      - name: Validate deploy.yml
        run: |
          pip install pyyaml
          python3 infra/validate_deploy.py

      - name: Lint check (Python)
        uses: astral-sh/ruff-action@v3

      - name: Format check (Python)
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"

      - name: Install Node dependencies
        run: npm install

      - name: Format check (JS/TS/CSS/JSON/MD)
        run: npm run format:check

      - name: Lint check (TS/TSX/JS/JSX)
        run: npm run lint

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      # Same rules the deploy workflow uses, so a PR builds exactly what the
      # merge would — no more (a docs PR built all three images before).
      - name: Select apps to build
        id: select
        run: |
          set -euo pipefail
          SELECTED=$(python3 infra/select_apps.py \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.sha }}")
          echo "apps=${SELECTED}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        if: steps.select.outputs.apps != ''
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        if: steps.select.outputs.apps != ''
        run: |
          set -euo pipefail
          for app in ${{ steps.select.outputs.apps }}; do
            APP_PATH=$(yq ".apps.${app}.path // \"apps/${app}\"" deploy.yml)
            echo "Building ${app}..."
            docker buildx build \
              --cache-from "type=gha,scope=${app}" \
              --cache-to "type=gha,scope=${app},mode=max" \
              --tag "${app}:pr-test" \
              --file "./${APP_PATH}/Dockerfile" \
              --load .
          done

          echo "✅ Docker images built successfully"
