name: PR Validation

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Config first — a broken deploy.yml fails the whole deploy, so catch it
      # before spending CI minutes on Docker builds.
      - name: Validate deploy.yml
        run: |
          pip install pyyaml
          python3 infra/validate_deploy.py

      - name: Lint check (Python)
        uses: astral-sh/ruff-action@v3

      - name: Format check (Python)
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"

      - name: Install Node dependencies
        run: npm install

      - name: Format check (JS/TS/CSS/JSON/MD)
        run: npm run format:check

      - name: Lint check (TS/TSX/JS/JSX)
        run: npm run lint

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker images
        run: |
          set -euo pipefail
          ENABLED=$(yq '.apps | to_entries[] | select(.value.enabled == true) | .key' deploy.yml)
          echo "Building Docker images for enabled apps: $ENABLED"

          for app in $ENABLED; do
            APP_PATH=$(yq ".apps.${app}.path // \"apps/${app}\"" deploy.yml)
            echo "Building ${app}..."
            docker buildx build \
              --cache-from "type=gha,scope=${app}" \
              --cache-to "type=gha,scope=${app},mode=max" \
              --tag "${app}:pr-test" \
              --file "./${APP_PATH}/Dockerfile" \
              --load .
          done

          echo "✅ All Docker images built successfully"

  autofix:
    needs: validate
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Apply ruff formatting (Python)
        uses: astral-sh/ruff-action@v3
        with:
          args: "format"
        continue-on-error: true

      - name: Apply ruff lint fixes (Python)
        uses: astral-sh/ruff-action@v3
        with:
          args: "check --fix"
        continue-on-error: true

      - name: Install Node dependencies
        run: npm install

      - name: Apply Prettier formatting (JS/TS/CSS/JSON/MD)
        run: npm run format || true

      - name: Apply ESLint fixes (TS/TSX/JS/JSX)
        run: npm run lint:fix || true

      - name: Commit fixes to PR
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "style: auto-fix lint and formatting issues"
            git push
            echo "✅ Auto-fixes committed to PR — please re-run checks"
          else
            echo "⚠️ No auto-fixable changes found — manual fixes may be needed"
          fi
