name: Test Deploy

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPO: ${{ github.repository }}

# Shared with Build and Deploy / Test Cleanup — see the note there.
concurrency:
  group: droplet
  cancel-in-progress: false

jobs:
  test-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Validate deploy.yml
        run: |
          pip install pyyaml
          python3 infra/validate_deploy.py

      - name: Read test config
        id: config
        run: |
          if [ ! -f test-deploy.yml ]; then
            echo "::error::test-deploy.yml not found on this branch."
            exit 1
          fi

          # Support both single app and multi-app formats
          # Single: app: bluestar
          # Multi:  apps: [pocketbase, ryanzrau]
          APPS=$(yq '.apps // [.app] | .[]' test-deploy.yml)
          if [ -z "$APPS" ]; then
            echo "::error::No apps found in test-deploy.yml"
            exit 1
          fi

          # Build a JSON array of {name, subdomain, port} for each test app
          TEST_APPS="[]"
          for app in $APPS; do
            SUBDOMAIN=$(yq ".apps.${app}.subdomain" deploy.yml)
            PORT=$(yq ".apps.${app}.port // 80" deploy.yml)
            if [ "$SUBDOMAIN" = "null" ]; then
              echo "::error::App '${app}' not found in deploy.yml"
              exit 1
            fi
            TEST_APPS=$(echo "$TEST_APPS" | yq -o=json ". + [{\"name\": \"${app}\", \"subdomain\": \"${SUBDOMAIN}\", \"port\": ${PORT}}]")
            echo "Test app: ${app} (subdomain: ${SUBDOMAIN}, port: ${PORT})"
          done

          # Output space-separated app names for build step
          APP_LIST=$(echo "$APPS" | tr '\n' ' ' | xargs)
          echo "app_list=${APP_LIST}" >> $GITHUB_OUTPUT
          # Use multiline output format for JSON
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "test_apps<<$EOF" >> $GITHUB_OUTPUT
          echo "$TEST_APPS" >> $GITHUB_OUTPUT
          echo "$EOF" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push test images
        env:
          # Same name-based resolution as the prod workflow, but a TEST_<ARG>
          # secret wins when present, so test builds can point at test backends.
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          for APP in ${{ steps.config.outputs.app_list }}; do
            IMAGE=$(echo "${{ env.REGISTRY }}/${{ env.REPO }}/${APP}:test" | tr '[:upper:]' '[:lower:]')
            APP_PATH=$(yq ".apps.${APP}.path // \"apps/${APP}\"" deploy.yml)

            BUILD_ARGS=()
            for arg in $(yq ".apps.${APP}.build_args // [] | .[]" deploy.yml); do
              value=$(jq -r --arg k "TEST_$arg" '.[$k] // empty' <<< "$ALL_SECRETS")
              if [ -z "$value" ]; then
                value=$(jq -r --arg k "$arg" '.[$k] // empty' <<< "$ALL_SECRETS")
              fi
              if [ -z "$value" ]; then
                echo "::error::build arg '${arg}' for '${APP}' has no matching GitHub secret (tried TEST_${arg} and ${arg})"
                exit 1
              fi
              BUILD_ARGS+=(--build-arg "${arg}=${value}")
            done

            echo "=== Building ${APP} (test) ==="
            docker buildx build "${BUILD_ARGS[@]}" \
              --cache-from "type=gha,scope=${APP}" \
              --tag "$IMAGE" \
              --file "./${APP_PATH}/Dockerfile" \
              --push .
            echo "=== Pushed $IMAGE ==="
          done

      - name: Copy branch deploy.yml and infra to droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: "deploy.yml,infra/generate-compose.py"
          target: "/opt/apps"
          overwrite: true

      - name: Deploy to droplet
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /opt/apps

            # Write active test config (multi-app format)
            cat > test-deploy.active.yml <<'ACTIVEEOF'
            ${{ steps.config.outputs.test_apps }}
            ACTIVEEOF

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Generate docker-compose.yml from branch's deploy.yml + test config
            python3 infra/generate-compose.py

            # Restore main's files after generation
            git checkout -- deploy.yml infra/generate-compose.py

            # Pull and start only the test services (prod services already running)
            TEST_SERVICES=""
            for app in ${{ steps.config.outputs.app_list }}; do
              docker compose pull "${app}-test" || true
              TEST_SERVICES="${TEST_SERVICES} ${app}-test"
            done
            docker compose up -d --no-deps $TEST_SERVICES

            docker image prune -f

            # A test container that crashes on boot should fail the run, not sit
            # there silently behind a 502.
            sleep 10
            FAILED=""
            for app in ${{ steps.config.outputs.app_list }}; do
              cid=$(docker compose ps -q "${app}-test")
              status=$(docker inspect -f '{{.State.Status}}' "$cid" 2>/dev/null || echo missing)
              if [ "$status" != "running" ]; then
                FAILED="${FAILED} ${app}-test(${status})"
                docker compose logs --tail 50 "${app}-test" || true
              fi
            done
            if [ -n "$FAILED" ]; then
              echo "::error::test containers not running:${FAILED}"
              exit 1
            fi

            echo "=== Test deployment complete ==="
